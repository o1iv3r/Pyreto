repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty check pyreto
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest-fast
        name: pytest fast tests
        entry: bash -c 'uv run pytest tests/ -x -q --ignore=tests/test_fitting.py; rc=$?; [ $rc -eq 5 ] && exit 0 || exit $rc'
        language: system
        pass_filenames: false
        stages: [pre-commit]
